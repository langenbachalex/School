<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Power Game</title>
<meta name="theme-color" content="#1f5fd1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Power">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="london-run.css">
</head>
<body>
<div class="tempo-leiste"><a class="tempo-knopf" href="franz/" aria-label="Zur Französisch-App" title="Zur Französisch-App" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.3rem"><svg viewBox="0 0 3 2" width="30" height="20" aria-hidden="true" style="border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.2)"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg></a><button type="button" id="tippen" class="tempo-knopf tipp-knopf" aria-label="Antworten eintippen" aria-pressed="false">⌨️</button><button type="button" id="tempo" class="tempo-knopf" aria-label="Sprechtempo">🔊 1,0×</button></div>
<main id="app" aria-live="polite"></main>

<dialog id="fragen" aria-labelledby="fragen-titel">
  <form method="dialog" class="fragen-kopf">
    <h2 id="fragen-titel">✏️ Frage für meinen Lehrer</h2>
    <button class="knopf leise" value="zu" aria-label="Schließen">✕</button>
  </form>
  <p class="klein">Schreib deine Frage auf. Sie bleibt nur auf diesem Gerät. Zeig sie mir am Mittwoch!</p>
  <label for="frage-text" class="unsichtbar">Deine Frage</label>
  <textarea id="frage-text" rows="3" placeholder="Was ist dir unklar?"></textarea>
  <button class="knopf haupt" id="frage-speichern" type="button">Frage speichern</button>
  <ol id="fragen-liste" class="fragen-liste"></ol>
</dialog>

<script src="qr.js"></script>
<script src="daten.js"></script>
<script src="runner.js"></script>
<script src="app.js"></script>
</body>
</html>
