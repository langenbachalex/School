Barry. Barry the barrel. Say hello to Barry.", "g": "Sprüche", "h": ""}, {"d": "gary_117", "f": "gary", "t": "Barry is shy. He never says hello back.", "g": "Sprüche", "h": ""}, {"d": "gary_118", "f": "gary", "t": "Do ravens do homework? I bet they do not. Lucky birds.", "g": "Sprüche", "h": ""}, {"d": "gary_119", "f": "gary", "t": "If I had wings, I would fly to the sandwich shop. Every day. Twice.", "g": "Sprüche", "h": ""}, {"d": "gary_120", "f": "gary", "t": "The ravens have a club. I am not in it. I have my own club. It has one member.", "g": "Sprüche", "h": ""}, {"d": "gary_121", "f": "gary", "t": "One raven winked at me. We are best friends now. He does not know yet.", "g": "Sprüche", "h": ""}, {"d": "gary_122", "f": "gary", "t": "I taught a raven to say “Gary is great.” It says “Gary is late.” Close enough.", "g": "Sprüche", "h": ""}, {"d": "gary_123", "f": "gary", "t": "Open sesame! … Open, please? … Open, pretty please with cheese on top?", "g": "Sprüche", "h": ""}, {"d": "gary_124", "f": "gary", "t": "I could climb over. I am an excellent climber. I am scared of heights.", "g": "Sprüche", "h": ""}, {"d": "gary_125", "f": "gary", "t": "I tried the magic word. The gate said no. Gates cannot talk. This is getting weird.", "g": "Sprüche", "h": ""}, {"d": "gary_126", "f": "gary", "t": "The clock says tick. I say tock. We are a band.", "g": "Sprüche", "h": ""}, {"d": "gary_127", "f": "gary", "t": "Nine o'clock is bedtime. Not for wizards. Wizards go to bed at … what comes after nine?", "g": "Sprüche", "h": ""}, {"d": "gary_128", "f": "gary", "t": "If the clock stops, do we all stop? … I just stopped. Did you notice?", "g": "Sprüche", "h": ""}, {"d": "gary_129", "f": "gary", "t": "He said “FOX!” again. I think it means hello.", "g": "Sprüche", "h": ""}, {"d": "gary_130", "f": "gary", "t": "His hat is taller than me. I measured. He was not happy.", "g": "Sprüche", "h": ""}, {"d": "gary_131", "f": "gary", "t": "Left, right, left, right. I can do that. Left, left, ow.", "g": "Sprüche", "h": ""}, {"d": "gary_132", "f": "gary", "t": "I think there is a second, smaller Sergeant under the hat.", "g": "Sprüche", "h": ""}, {"d": "gary_133", "f": "gary", "t": "He says everything is bigger in Texas. I want to see a Texas sandwich.", "g": "Sprüche", "h": ""}, {"d": "gary_134", "f": "gary", "t": "Howdy! … I am learning American. Howdy, howdy, howdy.", "g": "Sprüche", "h": ""}, {"d": "gary_135", "f": "gary", "t": "He asked me for the gift shop. I sold him a spoon. Magic spoon. Ten pounds.", "g": "Sprüche", "h": ""}, {"d": "gary_136", "f": "gary", "t": "I can see my breath. Look! I am a dragon. Rawr, rawr.", "g": "Sprüche", "h": ""}, {"d": "gary_137", "f": "gary", "t": "Is it just me, or is that tower looking at us? … It is just me.", "g": "Sprüche", "h": ""}, {"d": "gary_138", "f": "gary", "t": "I am not lost. I know exactly where I am. I am here.", "g": "Sprüche", "h": ""}, {"d": "gary_139", "f": "gary", "t": "My hat is cold. My ears are in it. My ears are cold.", "g": "Sprüche", "h": ""}, {"d": "gary_140", "f": "gary", "t": "Do you want to hear a joke? Knock, knock. … You have to say “Who is there?” … Never mind.", "g": "Sprüche", "h": ""}, {"d": "gary_141", "f": "gary", "t": "What do you call a fox with a wand? Sir. You call him Sir.", "g": "Sprüche", "h": ""}, {"d": "gary_142", "f": "gary", "t": "I am thinking of a number. It is seven. Do not guess, I told you.", "g": "Sprüche", "h": ""}, {"d": "gary_143", "f": "gary", "t": "If we find the keys, I want a medal. A big one. Made of cheese.", "g": "Sprüche", "h": ""}, {"d": "gary_144", "f": "gary", "t": "My tail is asleep. Shh. Do not wake it.", "g": "Sprüche", "h": ""}, {"d": "gary_145", "f": "gary", "t": "Abracadabra! … Nothing. Abraca-sandwich! … Still nothing. I am hungry now.", "g": "Sprüche", "h": ""}, {"d": "gary_146", "f": "gary", "t": "I stepped in a puddle. Mr. Flex was in it. I am not sorry.", "g": "Sprüche", "h": ""}, {"d": "gary_147", "f": "gary", "t": "Psst. I can do one real trick. Watch my ears. … Did they move? They moved!", "g": "Sprüche", "h": ""}, {"d": "gary_148", "f": "gary", "t": "When I grow up, I want to be a wizard. … I am grown up. Oh no.", "g": "Sprüche", "h": ""}, {"d": "mrflex_76", "f": "mrflex", "t": "A puddle? I have been in better mirrors.", "g": "Sprüche", "h": ""}, {"d": "mrflex_77", "f": "mrflex", "t": "Windows, puddles, spoons. I am everywhere. You are welcome.", "g": "Sprüche", "h": ""}, {"d": "mrflex_78", "f": "mrflex", "t": "Do not step on me. I am in this puddle.", "g": "Sprüche", "h": ""}, {"d": "mrflex_79", "f": "mrflex", "t": "I look good in this window. I look good in every window.", "g": "Sprüche", "h": ""}, {"d": "mrflex_80", "f": "mrflex", "t": "Cold out there? I would not know. I am never cold.", "g": "Sprüche", "h": ""}, {"d": "mrflex_81", "f": "mrflex", "t": "A fox in a barrel. I have seen everything now.", "g": "Sprüche", "h": ""}, {"d": "mrflex_82", "f": "mrflex", "t": "The orange dog lives in a barrel. I live in a mirror. Mine is cleaner.", "g": "Sprüche", "h": ""}, {"d": "mrflex_83", "f": "mrflex", "t": "His barrel is small. My mirror is bigger. Everything of mine is bigger.", "g": "Sprüche", "h": ""}, {"d": "mrflex_84", "f": "mrflex", "t": "Seven ravens. I know all their names. They do not know mine. Sad for them.", "g": "Sprüche", "h": ""}, {"d": "mrflex_85", "f": "mrflex", "t": "The ravens are old. I am older. And better looking.", "g": "Sprüche", "h": ""}, {"d": "mrflex_86", "f": "mrflex", "t": "Arthur and I never talk. We are both too important.", "g": "Sprüche", "h": ""}, {"d": "mrflex_87", "f": "mrflex", "t": "The gate is locked. I could open it. I am busy.", "g": "Sprüche", "h": ""}, {"d": "mrflex_88", "f": "mrflex", "t": "Locked at 9:53. Every night. I am always on time too. Mostly.", "g": "Sprüche", "h": ""}, {"d": "mrflex_89", "f": "mrflex", "t": "Look at the clock. Then look at me. Much better, right?", "g": "Sprüche", "h": ""}, {"d": "mrflex_90", "f": "mrflex", "t": "That clock is on time. I am never late. People are early.", "g": "Sprüche", "h": ""}, {"d": "mrflex_91", "f": "mrflex", "t": "He shouts a lot. I never shout. I do not need to.", "g": "Sprüche", "h": ""}, {"d": "mrflex_92", "f": "mrflex", "t": "The Sergeant walks in circles. I prefer straight lines. And sofas.", "g": "Sprüche", "h": ""}, {"d": "mrflex_93", "f": "mrflex", "t": "Nice hat. Mine is better. It is pointier.", "g": "Sprüche", "h": ""}, {"d": "mrflex_94", "f": "mrflex", "t": "He has a map. I AM a map. Ask me.", "g": "Sprüche", "h": ""}, {"d": "mrflex_95", "f": "mrflex", "t": "He thinks this is Buckingham Palace. I like him. He is confident.", "g": "Sprüche", "h": ""}, {"d": "mrflex_96", "f": "mrflex", "t": "The cowboy knows nothing. And he is so happy. Interesting.", "g": "Sprüche", "h": ""}, {"d": "mrflex_97", "f": "mrflex", "t": "Lost? Walk around. The courtyard is big. So is my patience.", "g": "Sprüche", "h": ""}, {"d": "mrflex_98", "f": "mrflex", "t": "Try the door next to the barrel. Just an idea. A brilliant idea.", "g": "Sprüche", "h": ""}, {"d": "mrflex_99", "f": "mrflex", "t": "Go and talk to someone. Not the fox. … Fine. The fox.", "g": "Sprüche", "h": ""}, {"d": "mrflex_100", "f": "mrflex", "t": "I love the Tower at night. It is quiet. Except for the fox.", "g": "Sprüche", "h": ""}, {"d": "mrflex_101", "f": "mrflex", "t": "A foggy night in London. Perfect light for my face.", "g": "Sprüche", "h": ""}, {"d": "mrflex_102", "f": "mrflex", "t": "No running in the courtyard! … Sorry. Old habit.", "g": "Sprüche", "h": ""}, {"d": "mrflex_103", "f": "mrflex", "t": "Line up, please! Two by two! … Sorry. Wrong courtyard.", "g": "Sprüche", "h": ""}, {"d": "mrflex_104", "f": "mrflex", "t": "I used to walk here. On real feet. … Long story. Later.", "g": "Sprüche", "h": ""}, {"d": "mrflex_105", "f": "mrflex", "t": "See the little door in the Guard Room? … I said nothing.", "g": "Sprüche", "h": ""}, {"d": "mrflex_106", "f": "mrflex", "t": "This puddle is cold. And wet. Who designed puddles?", "g": "Sprüche", "h": ""}, {"d": "mrflex_107", "f": "mrflex", "t": "Splash me again and I turn you into a teapot. A small one.", "g": "Sprüche", "h": ""}, {"d": "mrflex_108", "f": "mrflex", "t": "Stop looking at yourself. Look at me. I am the better half.", "g": "Sprüche", "h": ""}, {"d": "mrflex_109", "f": "mrflex", "t": "I am in a spoon now. Do not ask. It is roomy.", "g": "Sprüche", "h": ""}, {"d": "mrflex_110", "f": "mrflex", "t": "A fish just swam past me. In a puddle. London is strange.", "g": "Sprüche", "h": ""}, {"d": "mrflex_111", "f": "mrflex", "t": "I once lived in a teapot. For a week. Much nicer than a barrel.", "g": "Sprüche", "h": ""}, {"d": "mrflex_112", "f": "mrflex", "t": "Barry the barrel? He named it? Of course he did.", "g": "Sprüche", "h": ""}, {"d": "mrflex_113", "f": "mrflex", "t": "The ravens asked for my autograph. I said no. They have no pens.", "g": "Sprüche", "h": ""}, {"d": "mrflex_114", "f": "mrflex", "t": "I speak Raven. “Kraa” means hello. “Kraa” also means goodbye. It is a simple language.", "g": "Sprüche", "h": ""}, {"d": "mrflex_115", "f": "mrflex", "t": "One of them is a pigeon. Nobody tell her.", "g": "Sprüche", "h": ""}, {"d": "mrflex_116", "f": "mrflex", "t": "I do not use gates. I use mirrors. And very clean windows.", "g": "Sprüche", "h": ""}, {"d": "mrflex_117", "f": "mrflex", "t": "Knock three times and say my name. Nothing will happen. But I enjoy it.", "g": "Sprüche", "h": ""}, {"d": "mrflex_118", "f": "mrflex", "t": "Tea time is at four. And at five. And now.", "g": "Sprüche", "h": ""}, {"d": "mrflex_119", "f": "mrflex", "t": "I invented time. Not really. But I was there.", "g": "Sprüche", "h": ""}, {"d": "mrflex_120", "f": "mrflex", "t": "He marches. I glide. We are not the same.", "g": "Sprüche", "h": ""}, {"d": "mrflex_121", "f": "mrflex", "t": "I asked him to smile once. In 1987. I am still waiting.", "g": "Sprüche", "h": ""}, {"d": "mrflex_122", "f": "mrflex", "t": "Under that hat is another hat. Trust me.", "g": "Sprüche", "h": ""}, {"d": "mrflex_123", "f": "mrflex", "t": "He called me “buddy.” Nobody calls me buddy. … I quite liked it.", "g": "Sprüche", "h": ""}, {"d": "mrflex_124", "f": "mrflex", "t": "He asked if I am the gift shop. I am a gift. Not a shop.", "g": "Sprüche", "h": ""}, {"d": "mrflex_125", "f": "mrflex", "t": "A cowboy in the Tower. Next week: a penguin. I can feel it.", "g": "Sprüche", "h": ""}, {"d": "mrflex_126", "f": "mrflex", "t": "I am not showing off. This is just my face.", "g": "Sprüche", "h": ""}, {"d": "mrflex_127", "f": "mrflex", "t": "Shall I flex? … You did not say no. Boom.", "g": "Sprüche", "h": ""}, {"d": "mrflex_128", "f": "mrflex", "t": "Please do not feed the fox. … Too late.", "g": "Sprüche", "h": ""}, {"d": "mrflex_129", "f": "mrflex", "t": "My muscles have muscles. Their names are Steve and Other Steve.", "g": "Sprüche", "h": ""}, {"d": "mrflex_130", "f": "mrflex", "t": "I do one push-up a day. One. Perfect. Push-up.", "g": "Sprüche", "h": ""}, {"d": "mrflex_131", "f": "mrflex", "t": "I tried being modest once. I was the best at it.", "g": "Sprüche", "h": ""}, {"d": "mrflex_132", "f": "mrflex", "t": "Magic word of the day: “biscuit.” It does nothing. I just like biscuits.", "g": "Sprüche", "h": ""}, {"d": "mrflex_133", "f": "mrflex", "t": "If you need me, shout. If you do not need me, shout anyway. I like attention.", "g": "Sprüche", "h": ""}, {"d": "mrflex_134", "f": "mrflex", "t": "My sunglasses have sunglasses. For very sunny days.", "g": "Sprüche", "h": ""}, {"d": "mrflex_135", "f": "mrflex", "t": "Do you want to know my real age? … So do I. I lost count in the spoon.", "g": "Sprüche", "h": ""}, {"d": "mrflex_136", "f": "mrflex", "t": "I am going to tell you a secret. Come closer. Closer. … I forgot it. Lovely to see you.", "g": "Sprüche", "h": ""}, {"d": "arthur_20", "f": "arthur", "t": "From this wall I see everything. Almost everything.", "g": "Sprüche", "h": ""}, {"d": "arthur_21", "f": "arthur", "t": "The stones are cold tonight. They remember.", "g": "Sprüche", "h": ""}, {"d": "arthur_22", "f": "arthur", "t": "Seven on the wall. Count again. … Are you sure?", "g": "Sprüche", "h": ""}, {"d": "arthur_23", "f": "arthur", "t": "We sit. We watch. We wait. It is enough.", "g": "Sprüche", "h": ""}, {"d": "arthur_24", "f": "arthur", "t": "Something walked here before you. It left no footprints.", "g": "Sprüche", "h": ""}, {"d": "arthur_25", "f": "arthur", "t": "Listen. … The Tower is breathing.", "g": "Sprüche", "h": ""}, {"d": "arthur_26", "f": "arthur", "t": "The fog comes from the river. It brings old stories.", "g": "Sprüche", "h": ""}, {"d": "arthur_27", "f": "arthur", "t": "The dark hides nothing, young one. It only keeps things. For later.", "g": "Sprüche", "h": ""}, {"d": "arthur_28", "f": "arthur", "t": "A door opens somewhere. Not for you. Not yet.", "g": "Sprüche", "h": ""}, {"d": "arthur_29", "f": "arthur", "t": "The wind knows your name. I told it.", "g": "Sprüche", "h": ""}, {"d": "arthur_30", "f": "arthur", "t": "Some nights, the bell rings by itself. Tonight is such a night.", "g": "Sprüche", "h": ""}, {"d": "arthur_31", "f": "arthur", "t": "There are more rooms in this Tower than doors.", "g": "Sprüche", "h": ""}, {"d": "arthur_32", "f": "arthur", "t": "Time is a thief. It takes everything. Slowly.", "g": "Sprüche", "h": ""}, {"d": "arthur_33", "f": "arthur", "t": "The clock counts the minutes. I count the years.", "g": "Sprüche", "h": ""}, {"d": "arthur_34", "f": "arthur", "t": "At 9:53 the keys must turn. They have always turned.", "g": "Sprüche", "h": ""}, {"d": "arthur_35", "f": "arthur", "t": "The gate remembers who went out. And who did not come back.", "g": "Sprüche", "h": ""}, {"d": "arthur_36", "f": "arthur", "t": "Beyond the gate is the river. The river keeps secrets too.", "g": "Sprüche", "h": ""}, {"d": "arthur_37", "f": "arthur", "t": "The fox sleeps in a barrel. The barrel does not complain. I do.", "g": "Sprüche", "h": ""}, {"d": "arthur_38", "f": "arthur", "t": "He calls it magic. I call it noise.", "g": "Sprüche", "h": ""}, {"d": "arthur_39", "f": "arthur", "t": "Barry. He named the barrel Barry. … Nine hundred winters, and now this.", "g": "Sprüche", "h": ""}, {"d": "arthur_40", "f": "arthur", "t": "The stranger holds his map upside down. He will go far. In the wrong direction.", "g": "Sprüche", "h": ""}, {"d": "arthur_41", "f": "arthur", "t": "The tall one guards the door. We guard the Tower.", "g": "Sprüche", "h": ""}, {"d": "arthur_42", "f": "arthur", "t": "You walk softly. Good. The stones like that.", "g": "Sprüche", "h": ""}, {"d": "arthur_43", "f": "arthur", "t": "You are small. The Tower is old. Be patient with each other.", "g": "Sprüche", "h": ""}, {"d": "arthur_44", "f": "arthur", "t": "One of us is not a raven. … I have said too much.", "g": "Sprüche", "h": ""}, {"d": "arthur_45", "f": "arthur", "t": "There are other towers. … Forget that. For now.", "g": "Sprüche", "h": ""}, {"d": "arthur_46", "f": "arthur", "t": "A king from Normandy built the great tower. Almost a thousand years ago. I watched.", "g": "Sprüche", "h": ""}, {"d": "arthur_47", "f": "arthur", "t": "They say: if the ravens leave, the Tower falls. So we stay.", "g": "Sprüche", "h": ""}, {"d": "arthur_48", "f": "arthur", "t": "They painted the great tower white. In 1240. Now you know its name.", "g": "Sprüche", "h": ""}, {"d": "arthur_49", "f": "arthur", "t": "Once, lions lived here. And an elephant. This was a zoo before it was a museum.", "g": "Sprüche", "h": ""}, {"d": "arthur_50", "f": "arthur", "t": "A white bear lived in this Tower. He went fishing in the river. On a long rope.", "g": "Sprüche", "h": ""}, {"d": "arthur_51", "f": "arthur", "t": "They made the kingdom's coins here. For five hundred years. I never got one.", "g": "Sprüche", "h": ""}, {"d": "arthur_52", "f": "arthur", "t": "A man called Newton looked after the coins here. He was good with numbers. And apples.", "g": "Sprüche", "h": ""}, {"d": "arthur_53", "f": "arthur", "t": "The crown sleeps in the Jewel House. A thief took it once. In 1671. He did not get far.", "g": "Sprüche", "h": ""}, {"d": "arthur_54", "f": "arthur", "t": "The first prisoner here climbed out of a window. On a rope. The rope came in a barrel. Tell the fox nothing.", "g": "Sprüche", "h": ""}, {"d": "arthur_55", "f": "arthur", "t": "A great fire ate London. In 1666. It stopped before these walls.", "g": "Sprüche", "h": ""}, {"d": "arthur_56", "f": "arthur", "t": "There was water all around this Tower. They let it out in 1843. I miss the frogs.", "g": "Sprüche", "h": ""}, {"d": "arthur_57", "f": "arthur", "t": "The Yeoman Warders have guarded this place since 1485. On great days they still wear the old red coats.", "g": "Sprüche", "h": ""}, {"d": "arthur_58", "f": "arthur", "t": "A prisoner lived here for thirteen years. He wrote a history of the world. He had time.", "g": "Sprüche", "h": ""}, {"d": "arthur_59", "f": "arthur", "t": "There is a Roman wall in this Tower. Older than the Tower. Older than me.", "g": "Sprüche", "h": ""}, {"d": "arthur_60", "f": "arthur", "t": "A stargazer watched the sky from the great tower. They say we annoyed him. He moved to Greenwich.", "g": "Sprüche", "h": ""}, {"d": "taube_25", "f": "taube", "t": "Guess what! Guess what! The fox named his barrel. Barry! I asked Barry. Barry said nothing. Very rude.", "g": "Sprüche", "h": "zwei Teile zusammengesetzt"}, {"d": "taube_26", "f": "taube", "t": "The Sergeant polishes his boots at midnight. He talks to them. The left boot is his favourite.", "g": "Sprüche", "h": ""}, {"d": "taube_27", "f": "taube", "t": "Have you heard? The cowboy thinks the ravens are small eagles. I will not tell him. I told everybody else.", "g": "Sprüche", "h": ""}, {"d": "taube_28", "f": "taube", "t": "Mr. Flex was in a spoon yesterday. A SPOON. I saw it. I see everything.", "g": "Sprüche", "h": ""}, {"d": "taube_29", "f": "taube", "t": "Arthur blinked today. Twice! It was in all the news. My news.", "g": "Sprüche", "h": ""}, {"d": "taube_30", "f": "taube", "t": "Mrs Crumb is baking something big. Very big. I counted the eggs. Forty! Forty eggs!", "g": "Sprüche", "h": ""}, {"d": "taube_31", "f": "taube", "t": "Mr Pike has a secret. I know it. I cannot tell you. … Ask me again.", "g": "Sprüche", "h": ""}, {"d": "taube_32", "f": "taube", "t": "The Sergeant has a tiny comb. For his beard. It has its own pocket.", "g": "Sprüche", "h": ""}, {"d": "taube_33", "f": "taube", "t": "I know who took the last biscuit. It was the wind. … It was me.", "g": "Sprüche", "h": ""}, {"d": "taube_34", "f": "taube", "t": "The ravens have a club. Very secret. I am not in it. I do not want to be in it. … I want to be in it.", "g": "Sprüche", "h": ""}, {"d": "taube_35", "f": "taube", "t": "Somebody was singing in the kitchen. Badly. Beautifully badly.", "g": "Sprüche", "h": ""}, {"d": "taube_36", "f": "taube", "t": "The fox practises his bow. In front of the barrel. Every morning. The barrel never claps.", "g": "Sprüche", "h": ""}, {"d": "taube_37", "f": "taube", "t": "The gate squeaks. Every night at the same time. I told the Sergeant. He oiled ME.", "g": "Sprüche", "h": ""}, {"d": "taube_38", "f": "taube", "t": "I have a cousin in Trafalgar Square. She knows a pigeon who knows the King. So I basically know the King.", "g": "Sprüche", "h": ""}, {"d": "taube_39", "f": "taube", "t": "My cousin at the museum says a cat lives there. A CAT. In a museum. I am never going.", "g": "Sprüche", "h": ""}, {"d": "taube_40", "f": "taube", "t": "News! News! A man with a map walked into a wall. He said sorry. To the wall.", "g": "Sprüche", "h": ""}, {"d": "taube_41", "f": "taube", "t": "The clock was one second late on Tuesday. ONE SECOND. The Sergeant did not sleep for a week.", "g": "Sprüche", "h": ""}, {"d": "taube_42", "f": "taube", "t": "Mr. Flex says he is five hundred years old. My grandmother says six hundred. She was there.", "g": "Sprüche", "h": ""}, {"d": "taube_43", "f": "taube", "t": "I heard the fox cannot read clocks. Do not tell him I told you. … Tell him. I want to see his face.", "g": "Sprüche", "h": ""}, {"d": "taube_44", "f": "taube", "t": "Someone dropped a sandwich by the gate. I am not saying who ate it. Coo. … It was delicious.", "g": "Sprüche", "h": ""}, {"d": "taube_45", "f": "taube", "t": "The Sergeant danced. In the dark. Alone. I have seen things, detective. Things.", "g": "Sprüche", "h": ""}, {"d": "taube_46", "f": "taube", "t": "One raven is shinier than the others. Very shiny. Strange. … Anyway! Guess what else!", "g": "Sprüche", "h": ""}, {"d": "taube_47", "f": "taube", "t": "I talk too much? Me? Who said that? Was it Arthur? He said a WORD? What word?", "g": "Sprüche", "h": ""}, {"d": "taube_48", "f": "taube", "t": "Breaking news! I have no news. This is the first time. Write it down.", "g": "Sprüche", "h": ""}, {"d": "sergeant_40", "f": "sergeant", "t": "Chin up. Chest out. Shoulders back. That is how we look for keys.", "g": "Sprüche", "h": ""}, {"d": "sergeant_41", "f": "sergeant", "t": "There is a right way, a wrong way, and my way. We use my way.", "g": "Sprüche", "h": ""}, {"d": "sergeant_42", "f": "sergeant", "t": "Rule number three: no questions about rule number two.", "g": "Sprüche", "h": ""}, {"d": "sergeant_43", "f": "sergeant", "t": "A tidy tower is a happy tower. A happy tower is a quiet tower.", "g": "Sprüche", "h": ""}, {"d": "sergeant_44", "f": "sergeant", "t": "We queue here. One behind the other. Even if there is only one of you.", "g": "Sprüche", "h": ""}, {"d": "sergeant_45", "f": "sergeant", "t": "Eyes front, detective! … The other front.", "g": "Sprüche", "h": ""}, {"d": "sergeant_46", "f": "sergeant", "t": "At the double! That means fast. But no running.", "g": "Sprüche", "h": ""}, {"d": "sergeant_47", "f": "sergeant", "t": "Stand still! … Not you, detective. The fox. … Both of you.", "g": "Sprüche", "h": ""}, {"d": "sergeant_48", "f": "sergeant", "t": "Speak up! I cannot hear you over my own shouting.", "g": "Sprüche", "h": ""}, {"d": "sergeant_49", "f": "sergeant", "t": "Keep calm. Carry on. Drink tea. In that order.", "g": "Sprüche", "h": ""}, {"d": "sergeant_50", "f": "sergeant", "t": "Tea solves everything. Except missing keys. I tried.", "g": "Sprüche", "h": ""}, {"d": "sergeant_51", "f": "sergeant", "t": "Milk first? Tea first? I do not discuss this on duty.", "g": "Sprüche", "h": ""}, {"d": "sergeant_52", "f": "sergeant", "t": "Fog again. Proper British weather. Lovely.", "g": "Sprüche", "h": ""}, {"d": "sergeant_53", "f": "sergeant", "t": "Cold? This is not cold. In my day, the fog had ice in it.", "g": "Sprüche", "h": ""}, {"d": "sergeant_54", "f": "sergeant", "t": "It is not raining. It is a wet sort of dry.", "g": "Sprüche", "h": ""}, {"d": "sergeant_55", "f": "sergeant", "t": "In my day, keys did not go missing. They did not dare.", "g": "Sprüche", "h": ""}, {"d": "sergeant_56", "f": "sergeant", "t": "In my day, we marched to school. Uphill. Both ways.", "g": "Sprüche", "h": ""}, {"d": "sergeant_57", "f": "sergeant", "t": "I have guarded this door for thirty years. It has never moved. Good door.", "g": "Sprüche", "h": ""}, {"d": "sergeant_58", "f": "sergeant", "t": "Look at these boots. You can see your face in them. Do not look too long.", "g": "Sprüche", "h": ""}, {"d": "sergeant_59", "f": "sergeant", "t": "A man is only as good as his boots. Mine are excellent.", "g": "Sprüche", "h": ""}, {"d": "sergeant_60", "f": "sergeant", "t": "This courtyard has four corners. I have checked every one. Twice.", "g": "Sprüche", "h": ""}, {"d": "sergeant_61", "f": "sergeant", "t": "Do not walk on the grass. It is very old grass.", "g": "Sprüche", "h": ""}, {"d": "sergeant_62", "f": "sergeant", "t": "Seven ravens. All present. … Who is that grey one?", "g": "Sprüche", "h": ""}, {"d": "sergeant_63", "f": "sergeant", "t": "Sir! The gift shop is closed. The Tower is closed. Everything is closed.", "g": "Sprüche", "h": ""}, {"d": "sergeant_64", "f": "sergeant", "t": "He called me partner. I am nobody's partner. I am a Sergeant.", "g": "Sprüche", "h": ""}, {"d": "sergeant_65", "f": "sergeant", "t": "Howdy? What is howdy? Is it a rule? I do not know this rule.", "g": "Sprüche", "h": ""}, {"d": "sergeant_66", "f": "sergeant", "t": "FOX! Stop naming things!", "g": "Sprüche", "h": ""}, {"d": "sergeant_67", "f": "sergeant", "t": "Barry? Who is Barry? … I do not want to know. … Who is Barry?", "g": "Sprüche", "h": ""}, {"d": "sergeant_68", "f": "sergeant", "t": "Under my hat is my head. Nothing else. Stop asking.", "g": "Sprüche", "h": ""}, {"d": "sergeant_69", "f": "sergeant", "t": "Jolly good. … I mean: acceptable.", "g": "Sprüche", "h": ""}, {"d": "sergeant_70", "f": "sergeant", "t": "I do not have a favourite detective. … It is you. Dismissed.", "g": "Sprüche", "h": ""}, {"d": "sergeant_71", "f": "sergeant", "t": "Sometimes I march just for fun. … That stays in this courtyard.", "g": "Sprüche", "h": ""}];
const NAMEN = {"mrflex": "Mr. Flex", "erzaehler": "Erzähler", "karte": "Karten", "gary": "Gary", "sergeant": "Sergeant", "taube": "Taube", "arthur": "Arthur", "tourist": "Tourist"};
const ZUERST = ["gary_149", "gary_150"];
const KEY = 'tower-anhoeren-v1';
let stand = {};
try { stand = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const sichern = () => { try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch (e) {} };
const liste = document.getElementById('liste'), filter = document.getElementById('filter');
const nurNeu = document.getElementById('nurNeu'), zahl = document.getElementById('zahl');
const player = new Audio();
let laeuft = null;
player.addEventListener('ended', () => { if (laeuft) laeuft.textContent = '▶ Abspielen'; laeuft = null; });
player.addEventListener('error', () => { if (laeuft) laeuft.textContent = 'Fehler – Datei fehlt?'; laeuft = null; });

const figuren = [...new Set(DATEN.map(e => e.f))];
filter.innerHTML = '<option value="zuerst">Zuerst anhören (' + ZUERST.length + ')</option><option value="">Alle</option>' +
  '<option value="g:Kapitel 1">Kapitel 1 (in Reihenfolge)</option><option value="g:Sprüche">Alle Sprüche</option>' +
  figuren.map(f => '<option value="f:' + f + '">' + (NAMEN[f] || f) + '</option>').join('');

function passt(e) {
  const v = filter.value;
  if (nurNeu.checked && !(stand[e.d] && stand[e.d].neu)) return false;
  if (v === 'zuerst') return ZUERST.includes(e.d);
  if (v.startsWith('g:')) return e.g === v.slice(2);
  if (v.startsWith('f:')) return e.f === v.slice(2);
  return true;
}
function zaehlen() {
  const n = Object.values(stand).filter(s => s.neu).length;
  zahl.textContent = n ? n + ' angekreuzt' : 'nichts angekreuzt';
}
function zeigen() {
  liste.textContent = '';
  let gruppe = '';
  const sicht = DATEN.filter(passt);
  if (filter.value === 'zuerst') sicht.sort((a, b) => ZUERST.indexOf(a.d) - ZUERST.indexOf(b.d));
  for (const e of sicht) {
    if (e.g !== gruppe) { gruppe = e.g; const h = document.createElement('h2'); h.textContent = gruppe; liste.appendChild(h); }
    const s = stand[e.d] || {};
    const z = document.createElement('div'); z.className = 'z' + (s.neu ? ' neu' : '');
    const kopf = document.createElement('div'); kopf.className = 'kopf';
    kopf.innerHTML = '<span class="fig"></span><span class="id"></span><span class="hin"></span>';
    kopf.children[0].textContent = NAMEN[e.f] || e.f; kopf.children[1].textContent = e.d; kopf.children[2].textContent = e.h;
    const txt = document.createElement('div'); txt.className = 'txt'; txt.textContent = e.t;
    const unten = document.createElement('div'); unten.className = 'unten';
    const knopf = document.createElement('button'); knopf.textContent = '▶ Abspielen';
    knopf.onclick = () => {
      if (laeuft === knopf) { player.pause(); knopf.textContent = '▶ Abspielen'; laeuft = null; return; }
      if (laeuft) laeuft.textContent = '▶ Abspielen';
      player.src = 'audio/tower/' + e.d + '.mp3'; player.play().catch(() => {});
      knopf.textContent = '■ Stopp'; laeuft = knopf;
    };
    const lab = document.createElement('label'); const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!s.neu;
    lab.append(cb, 'neu');
    const feld = document.createElement('input'); feld.type = 'text'; feld.placeholder = 'Stichwort'; feld.value = s.w || '';
    feld.setAttribute('aria-label', 'Stichwort zu ' + e.d);
    const merken = () => {
      if (cb.checked || feld.value.trim()) stand[e.d] = { neu: cb.checked, w: feld.value.trim() }; else delete stand[e.d];
      z.className = 'z' + (cb.checked ? ' neu' : ''); sichern(); zaehlen();
    };
    cb.onchange = merken;
    feld.oninput = () => { if (feld.value.trim() && !cb.checked) cb.checked = true; merken(); };
    unten.append(knopf, lab, feld); z.append(kopf, txt, unten); liste.appendChild(z);
  }
  if (!sicht.length) liste.textContent = 'Nichts in dieser Auswahl.';
  zaehlen();
}
filter.onchange = zeigen; nurNeu.onchange = zeigen;
document.getElementById('kopieren').onclick = async () => {
  const zeilen = DATEN.filter(e => stand[e.d] && stand[e.d].neu).map(e => e.d + ' – ' + (stand[e.d].w || 'neu aufnehmen') + ' – „' + e.t + '“');
  const text = zeilen.length ? 'Keys of the Tower – neu aufnehmen (' + zeilen.length + '):\n' + zeilen.join('\n') : 'Keys of the Tower – nichts angekreuzt.';
  const aus = document.getElementById('ausgabe'); aus.hidden = false; aus.value = text;
  try { await navigator.clipboard.writeText(text); zahl.textContent = 'kopiert'; } catch (e) { aus.select(); zahl.textContent = 'Text markiert – bitte kopieren'; }
};
zeigen();
</script>
