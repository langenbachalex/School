<!doctype html>
<!-- Prüfseite Körperbau (A2 bis A4, 18.11.2026): Gary wie heute · Mage wie heute · die Probe-Figur aus app/tower/probe3d_bau.js.
     Keine Seite der App; wird von werkzeuge/blender/koerperbau_probe.js unter /app/tower/koerperbau_probe.html ausgeliefert und aufgenommen. -->
<meta charset="utf-8"><title>Körperbau-Probe</title>
<style>
  body { margin: 0; background: #cfc8bf; font: 15px/1.2 Arial, sans-serif; color: #222; width: 900px; height: 560px; overflow: hidden; position: relative; }
  canvas { display: block; }
  #oben { position: absolute; top: 8px; left: 0; width: 900px; display: flex; }
  #oben div { flex: 1; text-align: center; }
  #unten { position: absolute; bottom: 8px; left: 0; width: 900px; text-align: center; font-weight: bold; font-size: 18px; }
</style>
<div id="oben"><div>Gary – wie heute</div><div>Mage-Körper – wie heute</div><div>Probe-Figur – gestreckt, mit Händen</div></div>
<div id="unten"></div>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./lib/GLTFLoader.js";
import { MeshoptDecoder } from "./lib/meshopt_decoder.module.js";
import { ladeFiguren } from "./probe3d_figuren.js";
import { ladeBauProbe, GESTEN } from "./probe3d_bau.js";

const q = new URLSearchParams(location.search);
// Szene: [Knopf aus der Gesten-Tabelle, Stelle für das Standbild (0…1)]
const SZENEN = [["stehen", .5], ["gehen", .3], ["reiben", .5], ["klatschen", .25], ["klatschen", .34], ["hueften", .5], ["highfive", .33], ["highfive", .52], ["salut", .5],
  ["bizeps", .5], ["kick", .32], ["kick", .47], ["mabu", .5], ["zeigen", .5], ["pubu", .5], ["spagat", .5]];

const bild = new THREE.WebGLRenderer({ antialias: true }); bild.setSize(900, 560); document.body.prepend(bild.domElement);
const szene = new THREE.Scene(); szene.background = new THREE.Color(0xcfc8bf);
szene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a6a, 1.5));
const sonne = new THREE.DirectionalLight(0xffffff, 1.8); sonne.position.set(2, 4, 5); szene.add(sonne);
const boden = new THREE.Mesh(new THREE.CircleGeometry(8, 48), new THREE.MeshBasicMaterial({ color: 0xbdb5aa })); boden.rotation.x = -Math.PI / 2; szene.add(boden);
const kamera = new THREE.PerspectiveCamera(26, 900 / 560, 0.1, 60); kamera.position.set(4.2, 1.5, 8.6); kamera.lookAt(0.1, 0.95, 0);
const lader = new GLTFLoader(); lader.setMeshoptDecoder(MeshoptDecoder);
const clips = {};
for (const d of ["kaykit_bewegungen", "gesten", "kungfu"]) for (const c of (await lader.loadAsync(`figuren/${d}.glb`)).animations) clips[c.name] = c;
const v = () => new THREE.Vector3();

async function heutige(x) {                             // der unveränderte Körper zum Vergleich
  const m = (await lader.loadAsync("figuren/probe_mage_ganz.glb")).scene;
  m.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
  m.updateMatrixWorld(true);
  m.scale.setScalar(0.785 / m.getObjectByName("head").getWorldPosition(v()).y); m.position.x = x; szene.add(m);
  const mixer = new THREE.AnimationMixer(m);
  return { spiele(name) { mixer.stopAllAction(); mixer.clipAction(clips[name]).reset().play(); mixer.update(0); }, bewege(dt) { mixer.update(dt); } };
}
const gary = await ladeFiguren(lader, szene, { gary: { x: -2.0, z: 0, bahn: 1.2 } }, kamera);
const heute = await heutige(-0.2), flex = await ladeBauProbe(lader, szene, { x: 1.9, z: 0, bahn: 0.01 });
for (const n of ["arm", "bein", "kopf", "rumpf", "knie"]) if (q.has(n)) flex.setze(n, +q.get(n));
let zeit = 0;
window.probe = {
  szenen: SZENEN.map(([knopf, stelle]) => ({ titel: GESTEN[knopf][1], dauer: clips[GESTEN[knopf][0]].duration, stelle, dauernd: GESTEN[knopf][2] === "Grund" })),
  setze(i) { const [knopf] = SZENEN[i]; document.getElementById("unten").textContent = GESTEN[knopf][1]; heute.spiele(GESTEN[knopf][0]); flex.befehl(knopf); flex.bewege(0); bild.render(szene, kamera); },
  takt(dt) { zeit += dt; gary.bewege(dt, zeit * 1000); heute.bewege(dt); flex.bewege(dt); bild.render(szene, kamera); return flex.zustand(); },
};
window.probe.setze(0);
document.title = "bereit";
</script>
